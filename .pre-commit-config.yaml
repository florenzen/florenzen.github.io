repos:
  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint
        entry: node_modules/.bin/markdownlint-cli2
        language: system
        types: [markdown]

      - id: prettier
        name: prettier (format check)
        entry: node_modules/.bin/prettier --check
        language: system
        files: (\.(json|ya?ml)|(^|/)\.nsprc)$
        # Generated by npm and the Dev Containers CLI.
        exclude: (^|/)(package-lock|devcontainer-lock)\.json$

      - id: npm-audit
        name: npm audit (exceptions in .nsprc)
        entry: npm run --silent audit
        language: system
        # CI runs it on every push (pre-commit run --all-files), which also catches new advisories.
        files: ^(package(-lock)?\.json|\.nsprc)$
        pass_filenames: false

      - id: actionlint
        name: actionlint (GitHub workflows)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: shellcheck
        name: shellcheck (lint)
        entry: shellcheck
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt (format check)
        entry: shfmt --diff
        language: system
        types: [shell]

      - id: hadolint
        name: hadolint (Dockerfile lint)
        entry: hadolint
        language: system
        types: [dockerfile]

      - id: redirects
        name: redirects (r/<name> valid)
        # The build fails on an invalid name or a missing http(s) URL.
        entry: sh scripts/build.sh
        language: system
        files: ^(r/|scripts/build\.sh$)
        pass_filenames: false
